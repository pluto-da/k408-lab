packages:
  - apps/*
  - packages/*

# 允许执行安装脚本的依赖（原生模块 / 引擎下载）
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
  embedded-postgres: true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true

# 兼容旧版 pnpm（9/10）
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - argon2
  - esbuild
  - embedded-postgres
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/linux-arm64"

# 全仓统一 vite 版本（vitest 默认会解析到旧的 vite 5）
overrides:
  vite: "^6.4.4"
  # 测试运行器依赖的线程池（开发依赖）修复高危漏洞
  tinypool: "^2.1.2"
