name: k408

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-k408}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-k408}
      TZ: Asia/Shanghai
    # 2 vCPU / 2–4 GB 小机器的保守参数
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 1.0
    # 只保留 PostgreSQL 入口脚本切换到 postgres 用户、整理数据目录权限所需的能力
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        APT_MIRROR: ${APT_MIRROR:-}
        PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-}
    image: k408-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-k408}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-k408}?schema=public&connection_limit=10
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（至少 32 个字符）}
      DOMAIN: ${DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: "true"
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-60}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-10}
      # 只读文件系统下不让 Prisma CLI 写更新检查缓存
      CHECKPOINT_DISABLE: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=384
      TZ: Asia/Shanghai
    expose:
      - "3000"
    mem_limit: 512m
    cpus: 1.0
    # 以镜像里的 node 用户运行；根文件系统只读，只有 /tmp 可写；不需要任何 Linux 能力
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        BUILD_ID: ${BUILD_ID:-v1}
        # 站点完整地址（如 https://k408.example.com），设置后生成 sitemap.xml
        SITE_URL: ${SITE_URL:-}
        VITE_ICP_BEIAN: ${ICP_BEIAN:-}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    image: k408-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # 设置 DOMAIN 时自动 HTTPS；不设置则监听 :80（用 IP 访问）
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: 1.0
    # 镜像里以 uid 10001 运行；允许非 root 进程监听 80 / 443（只在容器自己的网络命名空间里生效）
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
